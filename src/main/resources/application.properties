spring.application.name=WorkOrderLocal

server.port=10000

central.url=http://localhost:10001

# WebClient buffer for large JSON from central (e.g. quality-info-steps with Base64 images). Default was 256 KiB.
central.webclient.max-in-memory-size-bytes=16777216

mock.qr-sim.enabled=true

# Workstation identity: {"machineName":"..."} written by admin UI; project root when cwd is server root
workstation.machine.config.file=./workstation-machine.json

# Flush buffered good-product counts to central on this interval (ms)
production.work-session.good-product-flush-interval-ms=30000

# Auto-open blocking control dialog after this many minutes (0 disables)
production.work-session.control-dialog-interval-minutes=30

